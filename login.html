<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portanko - Iniciar Sesión</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #1e1b4b 50%, #450a0a 100%);
      background-size: 400% 400%; animation: dynamicBackground 15s ease infinite;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #f8fafc; padding: 20px;
    }
    @keyframes dynamicBackground { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .login-card {
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
      border: 1px solid #1e3a8a; border-radius: 12px;
      padding: 40px; width: 100%; max-width: 380px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    .login-card h1 { font-size: 24px; letter-spacing: 3px; margin-bottom: 4px; }
    .login-card .tagline { color: #991b1b; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 28px; }

    label { display: block; text-align: left; font-size: 11px; text-transform: uppercase; color: #93c5fd; margin-bottom: 6px; margin-top: 16px; }
    input {
      width: 100%; background: rgba(2, 6, 23, 0.8); border: 1px solid #1e3a8a; color: #fff;
      padding: 12px; border-radius: 6px; font-size: 14px;
    }
    input:focus { outline: none; border-color: #991b1b; box-shadow: 0 0 8px rgba(153, 27, 27, 0.5); }

    button {
      width: 100%; background: #991b1b; color: #fff; border: none;
      padding: 13px; border-radius: 6px; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; cursor: pointer; margin-top: 24px; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(153, 27, 27, 0.4);
    }
    button:hover:not(:disabled) { background: #7f1d1d; transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: default; }

    .error-msg {
      display: none; background: rgba(153, 27, 27, 0.15); border: 1px solid #991b1b;
      color: #fca5a5; font-size: 13px; padding: 10px; border-radius: 6px; margin-top: 16px;
    }
    .hint { color: #64748b; font-size: 11px; margin-top: 20px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>PORTANKO</h1>
    <div class="tagline">Control Central Multi-TV</div>
    <form id="loginForm">
      <label for="email">Usuario (Email)</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <label for="keyword">Palabra Clave</label>
      <input type="password" id="keyword" required autocomplete="off" placeholder="Código interno del equipo">
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" id="submitBtn">Ingresar</button>
    </form>
    <p class="hint">Acceso exclusivo para el equipo de Portanko. Si no tenés credenciales o no sabés la palabra clave, pedíselas a un administrador.</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      databaseURL: "https://losmayorgatv-default-rtdb.firebaseio.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.firebasestorage.app",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:558232228bf76b70e7ea86",
      measurementId: "G-0RQ91ZPNWG"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Si ya hay una sesión activa (por ejemplo, se recargó la página estando
    // logueado), saltamos directo al panel sin volver a pedir nada.
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "admin-portanko.html";
    });

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    const ERROR_MESSAGES = {
      'auth/invalid-email': 'El email ingresado no es válido.',
      'auth/user-disabled': 'Este usuario fue deshabilitado.',
      'auth/user-not-found': 'Email o contraseña incorrectos.',
      'auth/wrong-password': 'Email o contraseña incorrectos.',
      'auth/invalid-credential': 'Email o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos fallidos. Esperá unos minutos e intentá de nuevo.'
    };

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerText = 'Ingresar';
    }

    /** Trae la palabra clave vigente desde Firestore (portanko_config/access).
     * Solo se puede leer estando ya autenticado (así lo exigen las Reglas de
     * Seguridad), por eso este chequeo va DESPUÉS de validar email+contraseña. */
    async function fetchExpectedKeyword() {
      try {
        const doc = await db.collection('portanko_config').doc('access').get();
        if (doc.exists && doc.data().keyword) return doc.data().keyword;
        return null; // todavía no se configuró ninguna palabra clave
      } catch (e) {
        console.warn('No se pudo leer la palabra clave configurada:', e);
        return undefined; // undefined = error de lectura, distinto de "no configurada"
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Ingresando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const typedKeyword = document.getElementById('keyword').value.trim();

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        showError(ERROR_MESSAGES[err.code] || 'No se pudo iniciar sesión. Intentá de nuevo.');
        return;
      }

      // Usuario y contraseña OK. Ahora validamos la palabra clave del equipo.
      const expectedKeyword = await fetchExpectedKeyword();

      if (expectedKeyword === undefined) {
        // No se pudo verificar (error de red/permisos): por seguridad, no dejamos pasar.
        await auth.signOut();
        showError('No se pudo verificar la palabra clave en este momento. Probá de nuevo.');
        return;
      }

      if (expectedKeyword !== null && typedKeyword !== expectedKeyword) {
        await auth.signOut(); // revocamos la sesión: usuario/contraseña válidos, pero falló la palabra clave
        showError('Palabra clave incorrecta.');
        return;
      }

      // Si expectedKeyword es null (todavía no configuraron ninguna), dejamos pasar igual
      // para no bloquear el primer uso — ver instrucciones para activar esta traba.
      window.location.href = "admin-portanko.html";
    });
  </script>
</body>
</html>
