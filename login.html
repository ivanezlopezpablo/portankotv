<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso Administrador - Portanko</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #020617 0%, #1e1b4b 50%, #450a0a 100%);
      background-size: 400% 400%;
      animation: dynamicBackground 15s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f8fafc;
    }

    @keyframes dynamicBackground {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e3a8a;
      padding: 36px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .login-title {
      color: #fca5a5;
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: #93c5fd;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      font-size: 11px;
      text-transform: uppercase;
      color: #93c5fd;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid #1e3a8a;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #991b1b;
      box-shadow: 0 0 10px rgba(153, 27, 27, 0.6);
    }

    .btn-login {
      background: #991b1b;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(153, 27, 27, 0.5);
    }

    .btn-login:hover {
      background: #7f1d1d;
      transform: translateY(-1px);
    }

    #errorMsg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-title">Portanko TV</div>
    <div class="login-subtitle">Panel de Control Centralizado</div>
    
    <div class="form-group">
      <label>Contraseña de Acceso</label>
      <input type="password" id="passwordInput" placeholder="Ingrese clave..." onkeypress="handleKeyPress(event)">
    </div>
    
    <button class="btn-login" onclick="attemptLogin()">Ingresar al Sistema</button>
    <div id="errorMsg">Contraseña incorrecta. Intente nuevamente.</div>
  </div>

  <script>
    function attemptLogin() {
      const pass = document.getElementById("passwordInput").value;
      // Contraseña por defecto para Portanko (puedes cambiarla aquí si lo deseas)
      if (pass === "portanko2026") {
        sessionStorage.setItem("portanko_auth", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("errorMsg").style.display = "block";
      }
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") attemptLogin();
    }
  </script>
</body>
</html>
