<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portanko - Acceso Seguro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --void: #04060c;
      --void-2: #0a0f1c;
      --panel: rgba(12, 17, 30, 0.82);
      --line: #1e2942;
      --signal: #38e1d1;
      --signal-dim: rgba(56, 225, 209, 0.16);
      --brand: #b3272d;
      --brand-dim: rgba(179, 39, 45, 0.18);
      --ink: #eef1f7;
      --muted: #8291ae;
      --danger: #f87171;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --sans: 'Segoe UI', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--void);
      color: var(--ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* ============ FONDO: grilla, orbes y barrido (scan-line) ============ */
    .bg-void {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(56,225,209,0.10), transparent 60%),
        radial-gradient(ellipse 70% 50% at 90% 110%, rgba(179,39,45,0.10), transparent 60%),
        linear-gradient(180deg, var(--void) 0%, var(--void-2) 100%);
    }
    .bg-grid {
      position: fixed; inset: -50px; z-index: 0; opacity: 0.35;
      background-image:
        linear-gradient(rgba(56,225,209,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,225,209,0.07) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: gridDrift 26s linear infinite;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000 30%, transparent 75%);
    }
    @keyframes gridDrift { from { background-position: 0 0, 0 0; } to { background-position: 42px 84px, 42px 84px; } }

    .bg-orb { position: fixed; z-index: 0; border-radius: 50%; filter: blur(60px); pointer-events: none; }
    .bg-orb--a { width: 380px; height: 380px; top: -100px; left: -80px; background: radial-gradient(circle, rgba(56,225,209,0.20), transparent 70%); animation: orbFloatA 22s ease-in-out infinite; }
    .bg-orb--b { width: 320px; height: 320px; bottom: -80px; right: -60px; background: radial-gradient(circle, rgba(179,39,45,0.18), transparent 70%); animation: orbFloatB 26s ease-in-out infinite; }
    .bg-orb--c { width: 220px; height: 220px; bottom: 20%; left: 8%; background: radial-gradient(circle, rgba(56,225,209,0.12), transparent 70%); animation: orbFloatC 19s ease-in-out infinite; }
    @keyframes orbFloatA { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,40px) scale(1.15); } }
    @keyframes orbFloatB { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,-30px) scale(1.1); } }
    @keyframes orbFloatC { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-40px) scale(1.2); } }

    .bg-scan {
      position: fixed; left: 0; right: 0; height: 140px; z-index: 0;
      background: linear-gradient(180deg, transparent, rgba(56,225,209,0.09), transparent);
      animation: scanSweep 7s linear infinite;
      pointer-events: none;
    }
    @keyframes scanSweep { 0% { top: -140px; } 100% { top: 100vh; } }

    @media (prefers-reduced-motion: reduce) {
      .bg-grid, .bg-orb, .bg-scan, .lock-shackle, .lock-keyhole, .card-ring, .eye-icon { animation: none !important; transition: none !important; }
    }

    /* ============ TARJETA DE LOGIN ============ */
    .login-card {
      position: relative; z-index: 1;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 44px 40px 36px;
      width: 100%; max-width: 400px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.55);
      text-align: center;
    }
    /* Anillo de escaneo animado alrededor del borde: el elemento firma del diseño */
    .card-ring {
      position: absolute; inset: -1px; z-index: -1; border-radius: 15px; padding: 1.5px;
      background: conic-gradient(from 0deg, transparent 0%, var(--signal) 6%, transparent 16%, transparent 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: ringRotate 4.5s linear infinite;
    }
    @keyframes ringRotate { to { transform: rotate(360deg); } }

    /* ---- Candado animado (motion graphics) ---- */
    .lock-wrap { width: 76px; height: 76px; margin: 0 auto 18px; position: relative; }
    .lock-svg { width: 100%; height: 100%; overflow: visible; }
    .lock-shackle {
      transform-origin: 50px 46px;
      animation: lockClose 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }
    @keyframes lockClose {
      0%   { transform: translateY(-9px) rotate(-22deg); opacity: 0.5; }
      60%  { transform: translateY(1px) rotate(3deg); opacity: 1; }
      100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    .lock-body { filter: drop-shadow(0 0 10px rgba(56,225,209,0.25)); }
    .lock-keyhole {
      animation: keyholePulse 2.6s ease-in-out 1.1s infinite;
      transform-origin: 50px 66px;
    }
    @keyframes keyholePulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.12); }
    }

    h1 { font-family: var(--mono); font-size: 22px; letter-spacing: 5px; font-weight: 700; color: var(--ink); }
    .tagline { font-family: var(--mono); color: var(--brand); font-size: 10px; text-transform: uppercase; letter-spacing: 2.5px; margin-top: 6px; margin-bottom: 30px; }
    .tagline::before { content: '// '; color: var(--signal); }

    label {
      display: block; text-align: left; font-family: var(--mono); font-size: 10.5px;
      text-transform: uppercase; letter-spacing: 1.5px; color: var(--signal);
      margin-bottom: 7px; margin-top: 18px;
    }
    .field-wrap { position: relative; }
    input {
      width: 100%; background: rgba(4, 6, 12, 0.7); border: 1px solid var(--line); color: var(--ink);
      padding: 12px 14px; border-radius: 7px; font-size: 14px; font-family: var(--sans);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: #4a5877; }
    input:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-dim); }
    .field-wrap input[type="password"], .field-wrap input[type="text"].pw-field { padding-right: 44px; }

    .eye-btn {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer; color: var(--muted);
      border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    .eye-btn:hover { color: var(--signal); background: rgba(56,225,209,0.08); }
    .eye-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .eye-icon .slash { transition: opacity 0.15s; }

    button[type="submit"] {
      width: 100%; background: linear-gradient(135deg, var(--brand) 0%, #7f1d1d 100%); color: #fff; border: none;
      padding: 13px; border-radius: 7px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; font-size: 12.5px; cursor: pointer; margin-top: 26px; transition: all 0.2s;
      box-shadow: 0 6px 18px rgba(179, 39, 45, 0.35);
    }
    button[type="submit"]:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(179, 39, 45, 0.5); }
    button[type="submit"]:disabled { opacity: 0.55; cursor: default; transform: none; }

    .error-msg {
      display: none; background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.4);
      color: var(--danger); font-size: 12.5px; padding: 10px 12px; border-radius: 7px; margin-top: 18px;
      text-align: left; font-family: var(--mono);
    }
    .hint { color: var(--muted); font-size: 11px; margin-top: 22px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="bg-void"></div>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb--a"></div>
  <div class="bg-orb bg-orb--b"></div>
  <div class="bg-orb bg-orb--c"></div>
  <div class="bg-scan"></div>

  <div class="login-card">
    <div class="card-ring"></div>

    <div class="lock-wrap">
      <svg class="lock-svg" viewBox="0 0 100 100">
        <g class="lock-shackle">
          <path d="M 34 46 L 34 32 A 16 16 0 0 1 66 32 L 66 46" fill="none" stroke="#8291ae" stroke-width="7" stroke-linecap="round"/>
        </g>
        <g class="lock-body">
          <rect x="24" y="44" width="52" height="40" rx="8" fill="#0c1120" stroke="#38e1d1" stroke-width="1.5"/>
          <g class="lock-keyhole">
            <circle cx="50" cy="60" r="5.5" fill="#38e1d1"/>
            <path d="M 47.5 63 L 52.5 63 L 51 72 L 49 72 Z" fill="#38e1d1"/>
          </g>
        </g>
      </svg>
    </div>

    <h1>PORTANKO</h1>
    <div class="tagline">Acceso Seguro · Control Central Multi-TV</div>

    <form id="loginForm">
      <label for="email">Usuario (Email)</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Contraseña</label>
      <div class="field-wrap">
        <input type="password" id="password" class="pw-field" required autocomplete="current-password">
        <button type="button" class="eye-btn" data-target="password" aria-label="Mostrar u ocultar contraseña">
          <svg class="eye-icon" viewBox="0 0 24 24">
            <path class="eye-shape" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle class="eye-pupil" cx="12" cy="12" r="3"/>
            <line class="slash" x1="3" y1="21" x2="21" y2="3" style="opacity:0;"/>
          </svg>
        </button>
      </div>

      <label for="keyword">Palabra Clave</label>
      <div class="field-wrap">
        <input type="password" id="keyword" class="pw-field" required autocomplete="off" placeholder="Código interno del equipo">
        <button type="button" class="eye-btn" data-target="keyword" aria-label="Mostrar u ocultar palabra clave">
          <svg class="eye-icon" viewBox="0 0 24 24">
            <path class="eye-shape" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle class="eye-pupil" cx="12" cy="12" r="3"/>
            <line class="slash" x1="3" y1="21" x2="21" y2="3" style="opacity:0;"/>
          </svg>
        </button>
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" id="submitBtn">Ingresar</button>
    </form>
    <p class="hint">Acceso exclusivo para el equipo de Portanko. Si no tenés credenciales o no sabés la palabra clave, pedíselas a un administrador.</p>
  </div>

  <script>
    /* ---- Toggle mostrar/ocultar para contraseña y palabra clave ---- */
    document.querySelectorAll('.eye-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const slash = btn.querySelector('.slash');
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        slash.style.opacity = isHidden ? '1' : '0';
      });
    });

    /* ---- Firebase + lógica de autenticación (usuario + contraseña + palabra clave) ---- */
    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      databaseURL: "https://losmayorgatv-default-rtdb.firebaseio.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.firebasestorage.app",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:558232228bf76b70e7ea86",
      measurementId: "G-0RQ91ZPNWG"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Si ya hay una sesión activa (por ejemplo, se recargó la página estando
    // logueado), saltamos directo al panel sin volver a pedir nada.
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = "admin.html";
    });

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    const ERROR_MESSAGES = {
      'auth/invalid-email': 'El email ingresado no es válido.',
      'auth/user-disabled': 'Este usuario fue deshabilitado.',
      'auth/user-not-found': 'Email o contraseña incorrectos.',
      'auth/wrong-password': 'Email o contraseña incorrectos.',
      'auth/invalid-credential': 'Email o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos fallidos. Esperá unos minutos e intentá de nuevo.'
    };

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerText = 'Ingresar';
    }

    /** Trae la palabra clave vigente desde Firestore (portanko_config/access).
     * Solo se puede leer estando ya autenticado (así lo exigen las Reglas de
     * Seguridad), por eso este chequeo va DESPUÉS de validar email+contraseña. */
    async function fetchExpectedKeyword() {
      try {
        const doc = await db.collection('portanko_config').doc('access').get();
        if (doc.exists && doc.data().keyword) return doc.data().keyword;
        return null; // todavía no se configuró ninguna palabra clave
      } catch (e) {
        console.warn('No se pudo leer la palabra clave configurada:', e);
        return undefined; // undefined = error de lectura, distinto de "no configurada"
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Verificando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const typedKeyword = document.getElementById('keyword').value.trim();

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        showError(ERROR_MESSAGES[err.code] || 'No se pudo iniciar sesión. Intentá de nuevo.');
        return;
      }

      // Usuario y contraseña OK. Ahora validamos la palabra clave del equipo.
      const expectedKeyword = await fetchExpectedKeyword();

      if (expectedKeyword === undefined) {
        // No se pudo verificar (error de red/permisos): por seguridad, no dejamos pasar.
        await auth.signOut();
        showError('No se pudo verificar la palabra clave en este momento. Probá de nuevo.');
        return;
      }

      if (expectedKeyword !== null && typedKeyword !== expectedKeyword) {
        await auth.signOut(); // revocamos la sesión: usuario/contraseña válidos, pero falló la palabra clave
        showError('Palabra clave incorrecta.');
        return;
      }

      // Si expectedKeyword es null (todavía no configuraron ninguna), dejamos pasar igual
      // para no bloquear el primer uso.
      window.location.href = "admin.html";
    });
  </script>
</body>
</html>
