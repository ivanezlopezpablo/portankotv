<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidriera Digital Multimedia TV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      cursor: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #slider-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Elementos multimedia (Imágenes y Videos) */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1);
      transition: opacity 1.5s ease-in-out, transform 7s ease-out;
      will-change: opacity, transform;
    }

    /* Los videos no usan zoom CSS para evitar tirones de procesamiento */
    video.slide {
      transition: opacity 1.5s ease-in-out;
      transform: none !important;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1.06);
    }

    #status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(220, 38, 38, 0.85);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="slider-container"></div>
  <div id="status-badge" class="hidden">Modo Offline</div>

  <script>
    // ------------------------------------------
    // CONFIGURACIÓN - EDITA TUS DATOS AQUÍ
    // ------------------------------------------
    const GITHUB_USER = "TU-USUARIO-DE-GITHUB"; 
    const GITHUB_REPO = "NOMBRE-DE-TU-REPOSITORIO"; 
    const FOLDER_PATH = "imagenes"; 
    const DURACION_IMAGEN_MS = 7000; // Duración para imágenes fijas
    const REFRESCAR_REPOS_MS = 5 * 60 * 1000; // Revisa contenido nuevo cada 5 minutos

    const container = document.getElementById("slider-container");
    const statusBadge = document.getElementById("status-badge");

    let mediaItems = [];
    let currentIndex = 0;
    let stepTimeout = null;

    // Obtener archivos desde la API de GitHub
    async function fetchMediaFromGitHub() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const files = await response.json();
        
        // Filtra tanto imágenes como videos
        const newMediaItems = files
          .filter(file => file.name.match(/\.(jpg|jpeg|png|webp|gif|mp4|webm)$/i))
          .map(file => ({
            url: file.download_url,
            type: file.name.match(/\.(mp4|webm)$/i) ? 'video' : 'image'
          }));

        statusBadge.classList.add("hidden");

        if (newMediaItems.length > 0) {
          if (JSON.stringify(newMediaItems) !== JSON.stringify(mediaItems)) {
            mediaItems = newMediaItems;
            updateDOMSlides();
          }
        }
      } catch (error) {
        console.warn("Sin acceso a red (usando versión en caché):", error);
        statusBadge.classList.remove("hidden");
      }
    }

    // Inyecta las etiquetas <img> o <video> según corresponda
    function updateDOMSlides() {
      clearTimeout(stepTimeout);
      container.innerHTML = "";
      
      mediaItems.forEach((item, index) => {
        let element;
        
        if (item.type === 'video') {
          element = document.createElement("video");
          element.src = item.url;
          element.muted = true; // Requisito de reproducción automática en navegadores
          element.playsInline = true;
          element.preload = "auto";
        } else {
          element = document.createElement("img");
          element.src = item.url;
        }

        element.classList.add("slide");
        if (index === 0) element.classList.add("active");
        
        container.appendChild(element);
      });

      currentIndex = 0;
      playCurrentSlide();
    }

    // Lógica del bucle híbrido (Foto vs Video)
    function playCurrentSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length === 0) return;

      const currentSlide = slides[currentIndex];

      if (currentSlide.tagName.toLowerCase() === 'video') {
        currentSlide.currentTime = 0;
        
        // Al terminar el video, pasa automáticamente al siguiente elemento
        currentSlide.onended = () => nextSlide();

        currentSlide.play().catch(err => {
          console.warn("Error al reproducir video (saltando):", err);
          nextSlide();
        });
      } else {
        // Si es imagen, espera la duración configurada
        stepTimeout = setTimeout(() => {
          nextSlide();
        }, DURACION_IMAGEN_MS);
      }
    }

    function nextSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      const currentSlide = slides[currentIndex];
      
      // Si el elemento actual era un video, lo pausa
      if (currentSlide.tagName.toLowerCase() === 'video') {
        currentSlide.pause();
        currentSlide.onended = null;
      }

      currentSlide.classList.remove("active");
      
      currentIndex = (currentIndex + 1) % slides.length;
      
      slides[currentIndex].classList.add("active");
      playCurrentSlide();
    }

    // Inicio
    fetchMediaFromGitHub();
    setInterval(fetchMediaFromGitHub, REFRESCAR_REPOS_MS);
  </script>
</body>
</html>
