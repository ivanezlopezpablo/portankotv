<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidriera Digital TV - Portanko</title>
  <style>
    /* Reset y estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      cursor: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Pantalla Vertical Rotada 270° */
    #slider-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(270deg);
      transform-origin: center center;
      z-index: 1;
    }

    /* Diapositivas multimedia */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      z-index: 1;
      transform: scale(1);
      transition: opacity 1.5s ease-in-out, transform 7s ease-out;
      will-change: opacity, transform;
    }

    /* Estado activo */
    .slide.active {
      opacity: 1 !important;
      z-index: 10 !important;
      transform: scale(1.05);
    }

    /* Indicador de estado offline */
    #status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      transition: opacity 0.5s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="slider-container"></div>
  <div id="status-badge" class="hidden">Modo Offline</div>

  <audio id="bg-music" loop preload="auto"></audio>

  <script>
    // ------------------------------------------
    // CONFIGURACIÓN DE TU REPOSITORIO Y MÚSICA
    // ------------------------------------------
    const GITHUB_USER = "ivanezlopezpablo"; 
    const GITHUB_REPO = "portankotv1"; 
    const FOLDER_PATH = "imagenes"; 
    const DURACION_IMAGEN_MS = 7000; // 7 segundos por foto
    const REFRESCAR_REPOS_MS = 5 * 60 * 1000; // Sincroniza fotos cada 5 min

    // URL PÚBLICA DE FIREBASE INTEGRADA
    const FIREBASE_AUDIO_URL = "https://firebasestorage.googleapis.com/v0/b/digestos-536e1.firebasestorage.app/o/Lumi%20Sin%20Gluten%2FM%C3%BAsica%20Relaxante%20para%20Cl%C3%ADnicas%20Consult%C3%B3rios%20e%20Pilates%20%E2%80%93%20Ambiente%20Calmo%20e%20Profissional.mp3?alt=media&token=ddeae6e0-63d2-4d7f-95c8-14ac0092c2e6";

    const container = document.getElementById("slider-container");
    const statusBadge = document.getElementById("status-badge");
    const bgMusic = document.getElementById("bg-music");

    let mediaItems = [];
    let currentIndex = 0;
    let stepTimeout = null;

    // Configuración del reproductor de audio
    function initBackgroundAudio() {
      if (!FIREBASE_AUDIO_URL) return;

      bgMusic.src = FIREBASE_AUDIO_URL;
      bgMusic.volume = 0.5; // Volumen al 50%

      const playAudio = () => {
        bgMusic.play().catch(err => {
          console.warn("Autoplay bloqueado. Activa 'Allow Autoplay' en Fully Kiosk:", err);
        });
      };

      playAudio();
      document.addEventListener("click", playAudio, { once: true });
    }

    // Obtener las imágenes desde GitHub
    async function fetchMediaFromGitHub() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}?t=${new Date().getTime()}`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const files = await response.json();
        
        const newMediaItems = files
          .filter(file => file.name.match(/\.(jpg|jpeg|png|webp|gif)$/i))
          .map(file => file.download_url);

        statusBadge.classList.add("hidden");

        if (newMediaItems.length > 0) {
          if (JSON.stringify(newMediaItems) !== JSON.stringify(mediaItems)) {
            mediaItems = newMediaItems;
            updateDOMSlides();
          }
        }
      } catch (error) {
        console.warn("Error cargando imágenes:", error);
        statusBadge.classList.remove("hidden");
      }
    }

    function updateDOMSlides() {
      clearTimeout(stepTimeout);
      container.innerHTML = "";
      
      mediaItems.forEach((url, index) => {
        const img = document.createElement("img");
        img.src = url;
        img.classList.add("slide");
        if (index === 0) img.classList.add("active");
        container.appendChild(img);
      });

      currentIndex = 0;
      playCurrentSlide();
    }

    function playCurrentSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length === 0) return;

      stepTimeout = setTimeout(() => {
        nextSlide();
      }, DURACION_IMAGEN_MS);
    }

    function nextSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      slides[currentIndex].classList.remove("active");
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add("active");
      
      playCurrentSlide();
    }

    // Inicialización
    initBackgroundAudio();
    fetchMediaFromGitHub();
    setInterval(fetchMediaFromGitHub, REFRESCAR_REPOS_MS);
  </script>
</body>
</html>
