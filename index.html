<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidriera Digital Multi-TV - Portanko</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      cursor: none;
      font-family: 'Segoe UI', -apple-system, sans-serif;
    }

    #loader-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #020617;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .brand-loader h1 { color: #ffffff; font-size: 28px; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; text-align: center; }
    .brand-loader span { color: #d97706; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; display: block; text-align: center; margin-top: 4px; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(217, 119, 6, 0.2);
      border-top: 3px solid #d97706;
      border-radius: 50%;
      margin-top: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #slider-container {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw; height: 100vh;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      z-index: 1;
      transition: transform 0.5s ease-in-out;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #slider-container.orientation-270 { width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(270deg); }
    #slider-container.orientation-90 { width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(90deg); }
    #slider-container.orientation-0 { width: 100vw; height: 100vh; transform: translate(-50%, -50%) rotate(0deg); }

    /* Ajuste Clave: contain para evitar recortes + margen auto */
    .slide-media {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain !important;
      opacity: 0;
      z-index: 1;
      transition: opacity 1.2s ease-in-out;
      will-change: opacity;
    }

    .slide-media.active {
      opacity: 1 !important;
      z-index: 10 !important;
    }

    #legal-banner {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      font-size: 14px;
      padding: 10px;
      text-align: center;
      z-index: 100;
      letter-spacing: 1px;
      border-top: 1px solid rgba(217, 119, 6, 0.3);
      backdrop-filter: blur(8px);
    }

    #status-badge {
      position: absolute;
      top: 20px; right: 20px;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <div id="loader-screen">
    <div class="brand-loader">
      <h1>PORTANKO</h1>
      <span>Abogados e Inmobiliaria</span>
    </div>
    <div class="spinner"></div>
  </div>

  <div id="slider-container" class="orientation-270"></div>
  <div id="legal-banner" class="hidden">Portanko Abogados e Inmobiliaria</div>
  <div id="status-badge" class="hidden">Modo Offline</div>

  <audio id="bg-music" loop preload="auto"></audio>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const TV_ID = urlParams.get('tv') || 'tv1';

    const container = document.getElementById("slider-container");
    const loaderScreen = document.getElementById("loader-screen");
    const statusBadge = document.getElementById("status-badge");
    const legalBanner = document.getElementById("legal-banner");
    const bgMusic = document.getElementById("bg-music");

    let playlist = [];
    let currentIndex = 0;
    let stepTimeout = null;
    let currentAudioUrl = "";

    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      databaseURL: "https://losmayorgatv-default-rtdb.firebaseio.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.firebasestorage.app",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:558232228bf76b70e7ea86",
      measurementId: "G-0RQ91ZPNWG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function hideLoader() {
      if (loaderScreen) loaderScreen.classList.add("hidden");
    }

    function updateBackgroundAudio(audioSettings) {
      if (!audioSettings || !audioSettings.enabled || !audioSettings.audioUrl) {
        bgMusic.pause();
        currentAudioUrl = "";
        return;
      }

      if (currentAudioUrl !== audioSettings.audioUrl) {
        currentAudioUrl = audioSettings.audioUrl;
        bgMusic.src = currentAudioUrl;
        bgMusic.volume = audioSettings.volume !== undefined ? audioSettings.volume : 0.5;
        playAudioWithFallback();
      } else if (audioSettings.volume !== undefined) {
        bgMusic.volume = audioSettings.volume;
      }
    }

    function playAudioWithFallback() {
      const promise = bgMusic.play();
      if (promise !== undefined) {
        promise.catch(() => {
          document.addEventListener("click", () => { bgMusic.play(); }, { once: true });
        });
      }
    }

    function listenTVConfiguration() {
      db.collection("portanko_tvs").doc(TV_ID).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          applyOrientation(data.orientation || 270);
          updateBackgroundAudio(data.audioSettings);

          if (data.legalBanner) {
            legalBanner.innerText = data.legalBanner.text || "";
            if (data.legalBanner.show) legalBanner.classList.remove("hidden");
            else legalBanner.classList.add("hidden");
          }

          const newPlaylist = data.playlist || [];
          if (JSON.stringify(newPlaylist) !== JSON.stringify(playlist)) {
            playlist = newPlaylist;
            if (playlist.length > 0) renderCurrentSlide();
            else hideLoader();
          }
        } else {
          hideLoader();
        }
      }, err => {
        console.warn(err);
        statusBadge.classList.remove("hidden");
        hideLoader();
      });
    }

    function applyOrientation(degree) {
      container.className = "";
      container.classList.add(`orientation-${degree}`);
    }

    function renderCurrentSlide() {
      if (playlist.length === 0) return;
      if (stepTimeout) clearTimeout(stepTimeout);

      const item = playlist[currentIndex];
      const prevElement = container.querySelector(".slide-media.active");
      const rot = item.rotation || 0;

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.url;
        video.className = 'slide-media';
        video.style.transform = `rotate(${rot}deg)`;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;

        video.oncanplaythrough = () => {
          container.appendChild(video);
          setTimeout(() => {
            if (prevElement) prevElement.remove();
            video.classList.add("active");
            hideLoader();
          }, 50);
        };

        video.onended = () => { nextSlide(); };
        video.onerror = () => { nextSlide(); };

      } else {
        const img = document.createElement('img');
        img.src = item.url;
        img.className = 'slide-media';
        img.style.transform = `rotate(${rot}deg)`;

        img.onload = () => {
          container.appendChild(img);
          setTimeout(() => {
            if (prevElement) prevElement.remove();
            img.classList.add("active");
            hideLoader();
          }, 50);

          const durationMs = (item.duration || 7) * 1000;
          stepTimeout = setTimeout(() => { nextSlide(); }, durationMs);
        };

        img.onerror = () => { nextSlide(); };
      }
    }

    function nextSlide() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      renderCurrentSlide();
    }

    listenTVConfiguration();
  </script>
</body>
</html>
