<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidriera Digital Multi-TV - Portanko</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background-color: #000;
      overflow: hidden; cursor: none;
      font-family: 'Segoe UI', -apple-system, sans-serif;
    }

    /* ---------- LOADER ---------- */
    #loader-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #020617;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.8s ease, visibility 0.8s;
    }
    .brand-loader h1 { color: #fff; font-size: 28px; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; text-align: center; }
    .brand-loader span { color: #991b1b; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; display: block; text-align: center; margin-top: 4px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(153, 27, 27, 0.2);
      border-top: 3px solid #ef4444;
      border-radius: 50%; margin-top: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    /* Contenedor de la animación Lottie del spinner. Oculto por defecto: si Lottie
       carga bien se muestra y se oculta el spinner CSS; si falla, el CSS queda visible. */
    #lottie-loader { width: 90px; height: 90px; margin-top: 12px; display: none; }
    #lottie-empty { width: 110px; height: 110px; margin: 0 auto 12px; }

    /* Mensaje de "sin contenido" para poder diagnosticar en el local sin abrir consola */
    #empty-state {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #020617; color: #94a3b8;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9998; text-align: center; padding: 24px; font-size: 16px;
    }
    #empty-state h2 { color: #fff; font-size: 20px; margin-bottom: 8px; }

    /* ---------- CONTENEDOR / ORIENTACIÓN ---------- */
    #slider-container {
      position: absolute; top: 50%; left: 50%;
      width: 100vw; height: 100vh;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      z-index: 1; background: #000;
      display: flex; justify-content: center; align-items: center;
    }
    #slider-container.orientation-270 { width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(270deg); }
    #slider-container.orientation-90  { width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(90deg); }
    #slider-container.orientation-180 { width: 100vw; height: 100vh; transform: translate(-50%, -50%) rotate(180deg); }
    #slider-container.orientation-0   { width: 100vw; height: 100vh; transform: translate(-50%, -50%) rotate(0deg); }

    /* ---------- SLIDES ---------- */
    /* Capa externa: SOLO controla el desvanecimiento (fade-in / fade-out) entre
       slides. Nunca lleva rotación, para no pisarse con .rot-X. */
    .media-wrapper {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; margin: auto;
      width: 100%; height: 100%;
      opacity: 0; z-index: 1;
      transition: opacity 1.6s ease-in-out;
      will-change: opacity; overflow: hidden;
    }
    .media-wrapper.active { opacity: 1 !important; z-index: 10 !important; }

    /* Capa interna: SOLO controla la rotación manual del ítem (rot-0/90/180/270).
       Al vivir en un elemento distinto del fade, ambas transiciones conviven. */
    .media-rotator { position: absolute; top: 0; left: 0; right: 0; bottom: 0; margin: auto; }
    .media-rotator img, .media-rotator video { width: 100%; height: 100%; display: block; }

    .fit-cover   { object-fit: cover !important; }
    .fit-contain { object-fit: contain !important; }

    .rot-0   { transform: rotate(0deg); }
    .rot-90  { transform: rotate(90deg);  width: 100vh !important; height: 100vw !important; }
    .rot-180 { transform: rotate(180deg); }
    .rot-270 { transform: rotate(270deg); width: 100vh !important; height: 100vw !important; }

    /* ---------- INSIGNIA DE CONTENIDO (OPORTUNIDAD / VENDIDO / etc.) ---------- */
    #content-badge {
      position: absolute; top: 24px; left: 24px;
      background: #991b1b; color: #fff;
      padding: 10px 18px; border-radius: 6px;
      font-weight: bold; font-size: 22px; letter-spacing: 1px;
      z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,0.6);
      transition: opacity 0.4s ease;
    }

    /* ---------- EFECTO KEN BURNS (acercamiento suave opcional por imagen) ---------- */
    @keyframes kenBurnsZoom { from { transform: scale(1); } to { transform: scale(1.08); } }
    .ken-burns { animation-name: kenBurnsZoom; animation-timing-function: linear; animation-fill-mode: forwards; }

    /* ---------- BANNER LEGAL ---------- */
    #legal-banner {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 23, 42, 0.9); color: #f8fafc;
      font-size: 14px; padding: 10px; text-align: center;
      z-index: 100; letter-spacing: 1px;
      border-top: 1px solid rgba(153, 27, 27, 0.5); backdrop-filter: blur(8px);
    }

    /* ---------- BADGE DE ESTADO ---------- */
    #status-badge {
      position: absolute; top: 20px; right: 20px;
      background: rgba(153, 27, 27, 0.9); color: #fff;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      z-index: 999; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hidden { opacity: 0 !important; pointer-events: none !important; }
    .removed { display: none !important; }
  </style>
</head>
<body>

  <div id="loader-screen">
    <div class="brand-loader">
      <h1>PORTANKO</h1>
      <span>Abogados e Inmobiliaria</span>
    </div>
    <div class="spinner" id="css-spinner-fallback"></div>
    <div id="lottie-loader"></div>
  </div>

  <div id="empty-state" class="removed">
    <div id="lottie-empty"></div>
    <h2>Sin contenido programado</h2>
    <p id="empty-state-detail">No hay medios cargados para hoy en esta pantalla.</p>
  </div>

  <div id="slider-container" class="orientation-270"></div>
  <div id="content-badge" class="hidden"></div>
  <div id="legal-banner" class="hidden"></div>
  <div id="status-badge" class="hidden">Modo Offline</div>

  <audio id="bg-music" loop preload="auto"></audio>

  <script>
    /* =========================================================
       ANIMACIONES LOTTIE (incrustadas, sin depender de URLs externas)
       ========================================================= */
    // Anillo de carga (loop) — reemplaza al spinner CSS cuando Lottie está disponible.
    const LOTTIE_SPINNER_DATA = {"v":"5.9.0","fr":60,"ip":0,"op":60,"w":200,"h":200,"nm":"PortankoSpinner","ddd":0,"assets":[],
      "layers":[{"ddd":0,"ind":1,"ty":4,"nm":"ring","sr":1,
        "ks":{"o":{"a":0,"k":100},
          "r":{"a":1,"k":[{"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":0,"s":[0]},{"t":60,"s":[360]}]},
          "p":{"a":0,"k":[100,100,0]},"a":{"a":0,"k":[0,0,0]},"s":{"a":0,"k":[100,100,100]}},
        "ao":0,
        "shapes":[{"ty":"gr","it":[
          {"ty":"el","p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[150,150]}},
          {"ty":"tm","s":{"a":0,"k":0},"e":{"a":0,"k":72},"o":{"a":0,"k":0},"m":1},
          {"ty":"st","c":{"a":0,"k":[0.937,0.106,0.106,1]},"o":{"a":0,"k":100},"w":{"a":0,"k":12},"lc":2,"lj":2},
          {"ty":"tr","p":{"a":0,"k":[0,0]},"a":{"a":0,"k":[0,0]},"s":{"a":0,"k":[100,100]},"r":{"a":0,"k":0},"o":{"a":0,"k":100}}
        ],"nm":"ringGroup"}],
        "ip":0,"op":60,"st":0,"bm":0}]};

    // Ícono "respirando" (loop) para la pantalla de sin contenido.
    const LOTTIE_EMPTY_DATA = {"v":"5.9.0","fr":30,"ip":0,"op":60,"w":160,"h":160,"nm":"PortankoEmpty","ddd":0,"assets":[],
      "layers":[{"ddd":0,"ind":1,"ty":4,"nm":"pulse","sr":1,
        "ks":{
          "o":{"a":1,"k":[{"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":0,"s":[55]},{"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":30,"s":[100]},{"t":60,"s":[55]}]},
          "r":{"a":0,"k":0},"p":{"a":0,"k":[80,80,0]},"a":{"a":0,"k":[0,0,0]},
          "s":{"a":1,"k":[{"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":0,"s":[100,100,100]},{"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":30,"s":[114,114,100]},{"t":60,"s":[100,100,100]}]}
        },
        "ao":0,
        "shapes":[{"ty":"gr","it":[
          {"ty":"el","p":{"a":0,"k":[0,0]},"s":{"a":0,"k":[130,130]}},
          {"ty":"st","c":{"a":0,"k":[0.219,0.741,0.973,1]},"o":{"a":0,"k":100},"w":{"a":0,"k":8},"lc":2,"lj":2},
          {"ty":"tr","p":{"a":0,"k":[0,0]},"a":{"a":0,"k":[0,0]},"s":{"a":0,"k":[100,100]},"r":{"a":0,"k":0},"o":{"a":0,"k":100}}
        ],"nm":"pulseGroup"}],
        "ip":0,"op":60,"st":0,"bm":0}]};

    /** Inicializa una animación Lottie con manejo de errores: si algo falla
     * (librería no cargó, JSON inválido, etc.) simplemente no se muestra nada
     * animado y el resto de la pantalla sigue funcionando con normalidad. */
    function initLottieSafe(containerId, data, loop, fallbackToHide) {
      try {
        if (typeof lottie === 'undefined') return null;
        const el = document.getElementById(containerId);
        if (!el) return null;
        const anim = lottie.loadAnimation({
          container: el, renderer: 'svg', loop: !!loop, autoplay: true, animationData: data
        });
        el.style.display = 'block';
        if (fallbackToHide) { const fb = document.getElementById(fallbackToHide); if (fb) fb.style.display = 'none'; }
        return anim;
      } catch (e) {
        console.warn('No se pudo iniciar la animación Lottie:', e);
        return null;
      }
    }

    initLottieSafe('lottie-loader', LOTTIE_SPINNER_DATA, true, 'css-spinner-fallback');
    initLottieSafe('lottie-empty', LOTTIE_EMPTY_DATA, true, null);

    /* =========================================================
       CONFIGURACIÓN GENERAL
       ========================================================= */
    const urlParams = new URLSearchParams(window.location.search);
    const TV_ID = urlParams.get('tv') || 'tv1';

    const container     = document.getElementById("slider-container");
    const loaderScreen  = document.getElementById("loader-screen");
    const emptyState    = document.getElementById("empty-state");
    const emptyDetail   = document.getElementById("empty-state-detail");
    const statusBadge   = document.getElementById("status-badge");
    const legalBanner   = document.getElementById("legal-banner");
    const bgMusic       = document.getElementById("bg-music");

    const DEFAULT_LEGAL_TEXT = "Portanko Abogados e Inmobiliaria";
    const DAY_NAMES = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
    const MAX_CONSECUTIVE_ERRORS = 5; // corta el loop si TODO el playlist está roto

    let playlist = [];
    let currentIndex = 0;
    let stepTimeout = null;
    let currentAudioUrl = "";
    let lastFirestoreData = null;  // guardamos el último doc para recalcular en el cambio de día
    let lastAppliedDay = getCurrentDayName();
    let consecutiveErrors = 0;
    let firstRenderDone = false;

    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      databaseURL: "https://losmayorgatv-default-rtdb.firebaseio.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.firebasestorage.app",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:558232228bf76b70e7ea86",
      measurementId: "G-0RQ91ZPNWG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    // Cache local para tolerar cortes de conexión breves sin perder la última config
    db.enablePersistence({ synchronizeTabs: true }).catch(() => { /* no crítico si falla */ });

    /* =========================================================
       HELPERS
       ========================================================= */
    function getCurrentDayName() {
      return DAY_NAMES[new Date().getDay()];
    }

    function hideLoader() {
      if (loaderScreen && !loaderScreen.classList.contains("hidden")) {
        loaderScreen.classList.add("hidden");
      }
    }

    function showEmptyState(detailText) {
      hideLoader();
      if (detailText) emptyDetail.textContent = detailText;
      emptyState.classList.remove("removed");
    }

    function hideEmptyState() {
      emptyState.classList.add("removed");
    }

    function setOfflineBadge(isOffline) {
      statusBadge.classList.toggle("hidden", !isOffline);
    }

    function applyOrientation(degree) {
      const valid = [0, 90, 180, 270];
      const deg = valid.includes(Number(degree)) ? Number(degree) : 270;
      container.className = "";
      container.classList.add(`orientation-${deg}`);
    }

    function applyLegalBanner(config) {
      if (!config) {
        legalBanner.textContent = DEFAULT_LEGAL_TEXT;
        legalBanner.classList.remove("hidden");
        return;
      }
      legalBanner.textContent = config.text || DEFAULT_LEGAL_TEXT;
      if (config.show === false) legalBanner.classList.add("hidden");
      else legalBanner.classList.remove("hidden");
    }

    /** Muestra u oculta la insignia (OPORTUNIDAD / VENDIDO / etc.) del ítem actual. */
    function updateContentBadge(badgeText) {
      const badgeEl = document.getElementById('content-badge');
      if (!badgeEl) return;
      if (badgeText) {
        badgeEl.textContent = badgeText;
        badgeEl.classList.remove('hidden');
      } else {
        badgeEl.classList.add('hidden');
      }
    }

    function updateBackgroundAudio(audioSettings) {
      if (!audioSettings || !audioSettings.enabled || !audioSettings.audioUrl) {
        bgMusic.pause();
        currentAudioUrl = "";
        return;
      }
      if (currentAudioUrl !== audioSettings.audioUrl) {
        currentAudioUrl = audioSettings.audioUrl;
        bgMusic.src = currentAudioUrl;
        bgMusic.volume = audioSettings.volume !== undefined ? audioSettings.volume : 0.5;
        playAudioWithFallback();
      } else if (audioSettings.volume !== undefined) {
        bgMusic.volume = audioSettings.volume;
      }
    }

    function playAudioWithFallback() {
      const promise = bgMusic.play();
      if (promise !== undefined) {
        promise.catch(() => {
          // Algunos navegadores de Smart TV bloquean el autoplay con sonido:
          // reintenta ante el primer evento de interacción disponible.
          const retry = () => { bgMusic.play().catch(() => {}); };
          document.addEventListener("click", retry, { once: true });
          document.addEventListener("touchstart", retry, { once: true });
          document.addEventListener("keydown", retry, { once: true });
        });
      }
    }

    /** Calcula el playlist correspondiente al día de hoy, con retrocompatibilidad */
    function resolvePlaylistForToday(data) {
      const today = getCurrentDayName();
      if (data.schedule && Array.isArray(data.schedule[today])) {
        return data.schedule[today];
      }
      if (Array.isArray(data.playlist)) {
        return data.playlist; // retrocompatibilidad con documentos sin "schedule"
      }
      return [];
    }

    /** Precarga silenciosa del próximo ítem para evitar parpadeos/pantallas negras */
    function preloadItem(item) {
      if (!item) return;
      if (item.type === 'video') {
        const v = document.createElement('video');
        v.preload = 'auto';
        v.src = item.url;
        v.muted = true;
      } else {
        const img = new Image();
        img.src = item.url;
      }
    }

    /* =========================================================
       FIRESTORE: LISTENER PRINCIPAL
       ========================================================= */
    function listenTVConfiguration() {
      db.collection("portanko_tvs").doc(TV_ID).onSnapshot(
        doc => {
          setOfflineBadge(false);

          if (!doc.exists) {
            showEmptyState(`No existe configuración para la pantalla "${TV_ID}".`);
            return;
          }

          const data = doc.data();
          lastFirestoreData = data;
          lastAppliedDay = getCurrentDayName();

          applyOrientation(data.orientation);
          updateBackgroundAudio(data.audioSettings);
          applyLegalBanner(data.legalBanner);

          applyPlaylistFromData(data);
        },
        err => {
          console.warn("Firestore onSnapshot error:", err);
          setOfflineBadge(true);
          hideLoader();
          // Si nunca hubo datos ni cache local, mostramos el aviso; si ya había
          // contenido cargado, lo dejamos reproduciendo con lo último recibido.
          if (!lastFirestoreData) {
            showEmptyState("Sin conexión y sin datos en caché para esta pantalla.");
          }
        }
      );
    }

    function applyPlaylistFromData(data) {
      const newPlaylist = resolvePlaylistForToday(data);

      if (JSON.stringify(newPlaylist) === JSON.stringify(playlist)) {
        return; // nada cambió, no reiniciamos el slider
      }

      playlist = newPlaylist;
      currentIndex = 0;
      consecutiveErrors = 0;

      if (playlist.length > 0) {
        hideEmptyState();
        renderCurrentSlide();
      } else {
        showEmptyState(`No hay medios cargados para hoy (${getCurrentDayName()}) en "${TV_ID}".`);
      }
    }

    /* Revisa cada 30s si cambió el día calendario, para no depender de que
       Firestore dispare un nuevo evento al cruzar la medianoche. */
    setInterval(() => {
      const today = getCurrentDayName();
      if (today !== lastAppliedDay && lastFirestoreData) {
        lastAppliedDay = today;
        applyPlaylistFromData(lastFirestoreData);
      }
    }, 30000);

    /* Recarga automática diaria: una TV puede quedar semanas prendida sin
       reiniciarse, y con el tiempo cualquier navegador acumula memoria. Para
       evitar que eso termine en un cuelgue, recargamos la página una vez por
       día a una hora de bajo tránsito (por defecto, 4:00 AM hora local del TV). */
    const AUTO_RELOAD_HOUR = 4;
    let lastReloadCheckKey = '';
    setInterval(() => {
      const now = new Date();
      const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-${now.getMinutes()}`;
      if (key === lastReloadCheckKey) return;
      lastReloadCheckKey = key;
      if (now.getHours() === AUTO_RELOAD_HOUR && now.getMinutes() === 0) {
        location.reload();
      }
    }, 20000);

    /* =========================================================
       RENDERIZADO DE SLIDES
       ========================================================= */
    /** Al reemplazar un slide (sea por avance normal o por un cambio de contenido
     * que llegó desde Firestore mientras algo se estaba reproduciendo), hay que
     * "desconectar" los eventos del elemento saliente. Si no, un video que sigue
     * reproduciéndose visualmente durante el crossfade podría disparar su propio
     * "onended" más tarde y adelantar el índice de la playlist por las suyas,
     * desincronizando lo que se ve. Lo dejamos correr visualmente (para no cortar
     * el crossfade) pero ya no puede volver a llamar a nextSlide().
     */
    function neutralizeOutgoingMedia(prevWrapper) {
      if (!prevWrapper) return;
      const media = prevWrapper.querySelector('video');
      if (media) { media.onended = null; media.onerror = null; }
    }

    /** Libera por completo los recursos de un elemento ya retirado de pantalla. */
    function stopAndRemove(el) {
      if (!el) return;
      const media = el.querySelector('video');
      if (media) {
        try { media.pause(); media.removeAttribute('src'); media.load(); } catch (e) { /* no crítico */ }
      }
      el.remove();
    }

    function renderCurrentSlide() {
      if (playlist.length === 0) return;
      if (stepTimeout) clearTimeout(stepTimeout);

      const item = playlist[currentIndex];
      const nextItem = playlist[(currentIndex + 1) % playlist.length];
      const prevElement = container.querySelector(".media-wrapper.active");
      neutralizeOutgoingMedia(prevElement);
      const rot = item.rotation || 0;
      const fit = item.fit || 'cover';

      // Capa externa: sólo transición (opacidad + zoom). Capa interna: sólo rotación.
      const wrapper = document.createElement('div');
      wrapper.className = 'media-wrapper';
      const rotator = document.createElement('div');
      rotator.className = `media-rotator rot-${rot}`;

      const activateWrapper = () => {
        rotator.appendChild(mediaEl);
        wrapper.appendChild(rotator);
        container.appendChild(wrapper);
        requestAnimationFrame(() => {
          wrapper.classList.add("active");
          setTimeout(() => stopAndRemove(prevElement), 1600);
          hideLoader();
          hideEmptyState();
          firstRenderDone = true;
          consecutiveErrors = 0;
          preloadItem(nextItem); // precarga el siguiente mientras se muestra este
          updateContentBadge(item.badgeText);
        });
      };

      const handleItemError = () => {
        consecutiveErrors++;
        if (consecutiveErrors >= Math.max(MAX_CONSECUTIVE_ERRORS, playlist.length)) {
          showEmptyState("No se pudo reproducir el contenido cargado (verificar URLs).");
          return;
        }
        nextSlide();
      };

      let mediaEl;
      if (item.type === 'video') {
        mediaEl = document.createElement('video');
        mediaEl.src = item.url;
        mediaEl.className = `fit-${fit}`;
        mediaEl.autoplay = true;
        mediaEl.muted = true;
        mediaEl.playsInline = true;
        mediaEl.oncanplaythrough = activateWrapper;
        mediaEl.onended = () => { nextSlide(); };
        mediaEl.onerror = handleItemError;
      } else {
        mediaEl = document.createElement('img');
        mediaEl.src = item.url;
        mediaEl.className = `fit-${fit}`;
        const durationMs = (item.duration || 7) * 1000;
        if (item.kenBurns) {
          // El zoom dura la exhibición completa más el tiempo del fundido de entrada,
          // para que el acercamiento se note incluso durante el crossfade.
          mediaEl.classList.add('ken-burns');
          mediaEl.style.animationDuration = ((durationMs + 1600) / 1000) + 's';
        }
        mediaEl.onload = () => {
          activateWrapper();
          stepTimeout = setTimeout(() => { nextSlide(); }, durationMs);
        };
        mediaEl.onerror = handleItemError;
      }
    }

    function nextSlide() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      renderCurrentSlide();
    }

    /* =========================================================
       HEARTBEAT: avisa periódicamente que esta TV está en línea, para
       que el panel admin pueda mostrar "conectada" / "sin señal".
       ========================================================= */
    function sendHeartbeat() {
      try {
        db.collection("portanko_tvs").doc(TV_ID).set({
          status: {
            lastSeenIso: new Date().toISOString(),
            lastSeenServer: firebase.firestore.FieldValue.serverTimestamp()
          }
        }, { merge: true }).catch(() => { /* si falla, se reintenta en el próximo ciclo */ });
      } catch (e) { /* no crítico: el heartbeat nunca debe interrumpir la reproducción */ }
    }

    /* =========================================================
       INICIO
       ========================================================= */
    listenTVConfiguration();
    sendHeartbeat();
    setInterval(sendHeartbeat, 60000);

    // Watchdog: si a los 20s no renderizó nada (config vacía o URL colgada),
    // muestra el estado vacío en lugar de dejar el loader infinito.
    setTimeout(() => {
      if (!firstRenderDone) {
        showEmptyState(`Esperando contenido para "${TV_ID}"...`);
      }
    }, 20000);
  </script>
</body>
</html>
