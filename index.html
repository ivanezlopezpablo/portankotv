<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vidriera Digital TV - Portanko</title>
  <style>
    /* Reset y estilos base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      cursor: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* FORZAR PANTALLA VERTICAL (Lado izquierdo girado hacia arriba = 270deg) */
    #slider-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh;  /* Invertimos dimensiones para ajustar al giro */
      height: 100vw;
      transform: translate(-50%, -50%) rotate(270deg);
      transform-origin: center center;
      z-index: 1;
    }

    /* Diapositivas multimedia */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ajusta sin deformar llenando la pantalla */
      opacity: 0;
      z-index: 1;
      transform: scale(1);
      transition: opacity 1.5s ease-in-out, transform 7s ease-out;
      will-change: opacity, transform;
    }

    /* Estado activo */
    .slide.active {
      opacity: 1 !important;
      z-index: 10 !important;
      transform: scale(1.05);
    }

    video.slide {
      transform: none !important; /* Desactiva zoom en videos para mayor fluidez */
    }

    /* Indicador de estado offline */
    #status-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      transition: opacity 0.5s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="slider-container"></div>
  <div id="status-badge" class="hidden">Modo Offline</div>

  <script>
    // ------------------------------------------
    // CONFIGURACIÓN DE TU REPOSITORIO
    // ------------------------------------------
    const GITHUB_USER = "ivanezlopezpablo"; 
    const GITHUB_REPO = "portankotv1"; 
    const FOLDER_PATH = "imagenes"; 
    const DURACION_IMAGEN_MS = 7000; // 7 segundos por imagen
    const REFRESCAR_REPOS_MS = 5 * 60 * 1000; // Consulta actualizaciones cada 5 min

    const container = document.getElementById("slider-container");
    const statusBadge = document.getElementById("status-badge");

    let mediaItems = [];
    let currentIndex = 0;
    let stepTimeout = null;

    // Obtener la lista de archivos desde la API de GitHub
    async function fetchMediaFromGitHub() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FOLDER_PATH}?t=${new Date().getTime()}`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const files = await response.json();
        
        // Filtrar archivos de imagen y video válidos
        const newMediaItems = files
          .filter(file => file.name.match(/\.(jpg|jpeg|png|webp|gif|mp4|webm)$/i))
          .map(file => ({
            url: file.download_url,
            type: file.name.match(/\.(mp4|webm)$/i) ? 'video' : 'image'
          }));

        statusBadge.classList.add("hidden");

        if (newMediaItems.length > 0) {
          // Si el contenido cambió, regenerar el slider
          if (JSON.stringify(newMediaItems) !== JSON.stringify(mediaItems)) {
            mediaItems = newMediaItems;
            updateDOMSlides();
          }
        }
      } catch (error) {
        console.warn("Sin respuesta de GitHub API (usando caché o local):", error);
        statusBadge.classList.remove("hidden");
      }
    }

    // Inyectar elementos multimedia en la página
    function updateDOMSlides() {
      clearTimeout(stepTimeout);
      container.innerHTML = "";
      
      mediaItems.forEach((item, index) => {
        let element;
        
        if (item.type === 'video') {
          element = document.createElement("video");
          element.src = item.url;
          element.muted = true;
          element.playsInline = true;
          element.preload = "auto";
        } else {
          element = document.createElement("img");
          element.src = item.url;
        }

        element.classList.add("slide");
        if (index === 0) element.classList.add("active");
        
        container.appendChild(element);
      });

      currentIndex = 0;
      playCurrentSlide();
    }

    // Controlar el tiempo de cada imagen o reproducción de video
    function playCurrentSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length === 0) return;

      const currentSlide = slides[currentIndex];

      if (currentSlide.tagName.toLowerCase() === 'video') {
        currentSlide.currentTime = 0;
        currentSlide.onended = () => nextSlide();

        currentSlide.play().catch(err => {
          console.warn("Error reproduciendo video:", err);
          nextSlide();
        });
      } else {
        stepTimeout = setTimeout(() => {
          nextSlide();
        }, DURACION_IMAGEN_MS);
      }
    }

    // Pasar a la siguiente diapositiva en bucle
    function nextSlide() {
      const slides = document.querySelectorAll(".slide");
      if (slides.length <= 1) return;

      const currentSlide = slides[currentIndex];
      
      if (currentSlide.tagName.toLowerCase() === 'video') {
        currentSlide.pause();
        currentSlide.onended = null;
      }

      currentSlide.classList.remove("active");
      
      currentIndex = (currentIndex + 1) % slides.length;
      
      slides[currentIndex].classList.add("active");
      playCurrentSlide();
    }

    // Inicialización
    fetchMediaFromGitHub();
    setInterval(fetchMediaFromGitHub, REFRESCAR_REPOS_MS);
  </script>
</body>
</html>
