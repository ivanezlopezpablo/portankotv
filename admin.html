<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Multi-TV Avanzado - Portanko</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #d97706;
      --accent-hover: #b45309;
      --text: #f8fafc;
      --border: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }

    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 16px; margin-bottom: 24px; }
    
    .tv-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .tv-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .tv-btn.active { background: var(--accent); border-color: var(--accent); }
    .btn-add-tv { background: #10b981; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    .main-grid { display: grid; grid-template-columns: 1fr 420px; gap: 24px; }

    .section-card { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
    .section-title { color: var(--accent); font-size: 16px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }

    .form-row { display: flex; gap: 16px; margin-bottom: 14px; align-items: center; }
    label { font-size: 11px; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 4px; }
    input, select { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 4px; width: 100%; }

    .btn-action { background: var(--accent); color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; }

    /* Lista de reproducción / Playlist */
    .playlist-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--border); }
    .playlist-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-right: 12px; }
    .playlist-info { flex: 1; }
    .playlist-actions { display: flex; gap: 8px; align-items: center; }

    /* Contenedor de Vista Previa Responsive */
    .preview-stage { width: 100%; height: 500px; background: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; border: 2px dashed var(--border); }
    .preview-screen { width: 320px; height: 180px; background: #111; transition: transform 0.5s ease-in-out; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    
    /* Orientaciones en Vista Previa */
    .preview-screen.orient-0 { transform: rotate(0deg); width: 320px; height: 180px; }
    .preview-screen.orient-90 { transform: rotate(90deg); width: 280px; height: 157px; }
    .preview-screen.orient-270 { transform: rotate(270deg); width: 280px; height: 157px; }

    .preview-screen img, .preview-screen video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <div class="header">
    <h2>PORTANKO - Dashboard Multi-TV</h2>
    <button onclick="logout()" style="background:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Cerrar Sesión</button>
  </div>

  <!-- Selector de TVs y Alta de Nuevo TV -->
  <div class="tv-bar" id="tvContainer">
    <button class="tv-btn active" onclick="selectTV('tv1')">TV 1 - Vidriera Principal</button>
    <button class="btn-add-tv" onclick="addNewTV()">+ Agregar Nueva TV</button>
  </div>

  <div class="main-grid">
    <div>
      <!-- Ajustes de Pantalla y Audio -->
      <div class="section-card">
        <h3 class="section-title">Configuración de Pantalla & Música</h3>
        <div class="form-row">
          <div style="flex: 1;">
            <label>Orientación de Pantalla</label>
            <select id="orientationSelect" onchange="updatePreviewOrientation()">
              <option value="0">Horizontal (0°)</option>
              <option value="90">Vertical Derecha (90°)</option>
              <option value="270" selected>Vertical Invertida (270°)</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label>Música de Fondo</label>
            <select id="audioEnabled">
              <option value="true">Activado</option>
              <option value="false">Silenciado</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div style="flex: 3;">
            <label>URL del Archivo MP3</label>
            <input type="text" id="audioUrl" placeholder="https://firebasestorage.googleapis.com/...">
          </div>
          <div style="flex: 1;">
            <label>Volumen</label>
            <input type="number" id="audioVolume" step="0.1" min="0" max="1" value="0.5">
          </div>
        </div>
        <button class="btn-action" onclick="saveTVConfig()">Guardar Ajustes de TV</button>
      </div>

      <!-- Subida de Multimedia (Imágenes y Videos) -->
      <div class="section-card">
        <h3 class="section-title">Subir Nuevo Contenido Multimedia</h3>
        <div class="form-row">
          <div style="flex: 2;">
            <label>Seleccionar Archivo (Imagen / Video MP4)</label>
            <input type="file" id="mediaFileInput" accept="image/*,video/mp4">
          </div>
          <div style="flex: 1;">
            <label>Duración Imagen (Segs)</label>
            <input type="number" id="mediaDuration" value="7" min="1">
          </div>
        </div>
        <button class="btn-action" style="background:#2563eb;" onclick="uploadMedia()">Subir a esta TV</button>
      </div>

      <!-- Playlist / Reordenamiento de Contenidos -->
      <div class="section-card">
        <h3 class="section-title">Lista de Reproducción (Playlist)</h3>
        <div id="playlistContainer">
          <p style="color: #94a3b8;">Cargando contenidos...</p>
        </div>
      </div>
    </div>

    <!-- Vista Previa Adaptativa -->
    <div>
      <div class="section-card" style="position: sticky; top: 24px;">
        <h3 class="section-title">Vista Previa en Vivo</h3>
        <div class="preview-stage">
          <div id="previewScreen" class="preview-screen orient-270">
            <p id="previewPlaceholder" style="color: #64748b; font-size: 12px; text-align: center; padding: 10px;">Sin contenido en vista previa</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (!sessionStorage.getItem("portanko_auth")) window.location.href = "login.html";

    const firebaseConfig = {
      apiKey: "AIzaSyAhTFpjaWhAUnA3P5_pXGNgjAUlKEtDXAA",
      authDomain: "losmayorgatv.firebaseapp.com",
      databaseURL: "https://losmayorgatv-default-rtdb.firebaseio.com",
      projectId: "losmayorgatv",
      storageBucket: "losmayorgatv.firebasestorage.app",
      messagingSenderId: "859965884915",
      appId: "1:859965884915:web:558232228bf76b70e7ea86",
      measurementId: "G-0RQ91ZPNWG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentTV = "tv1";
    let tvPlaylist = [];

    function selectTV(tvId) {
      currentTV = tvId;
      document.querySelectorAll('.tv-btn').forEach(btn => btn.classList.remove('active'));
      if(event && event.target) event.target.classList.add('active');
      loadTVConfig();
    }

    function updatePreviewOrientation() {
      const orient = document.getElementById('orientationSelect').value;
      const screen = document.getElementById('previewScreen');
      screen.className = 'preview-screen orient-' + orient;
    }

    function loadTVConfig() {
      db.collection('portanko_tvs').doc(currentTV).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('orientationSelect').value = data.orientation || 270;
          updatePreviewOrientation();

          if (data.audioSettings) {
            document.getElementById('audioEnabled').value = data.audioSettings.enabled ? "true" : "false";
            document.getElementById('audioUrl').value = data.audioSettings.audioUrl || "";
            document.getElementById('audioVolume').value = data.audioSettings.volume || 0.5;
          }

          tvPlaylist = data.playlist || [];
          renderPlaylist();
        }
      });
    }

    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = "";

      if (tvPlaylist.length === 0) {
        container.innerHTML = '<p style="color: #94a3b8;">No hay ítems en esta lista.</p>';
        return;
      }

      tvPlaylist.forEach((item, index) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'playlist-item';
        itemDiv.innerHTML = `
          <div style="display:flex; align-items:center;">
            <img src="${item.url}" class="playlist-thumb" onerror="this.src='https://via.placeholder.com/50?text=Video'">
            <div>
              <strong style="font-size:13px; display:block;">${item.name || 'Slide ' + (index+1)}</strong>
              <small style="color:#94a3b8;">${item.type === 'video' ? 'Video MP4 (Auto)' : item.duration + ' segs'}</small>
            </div>
          </div>
          <div class="playlist-actions">
            <button style="background:#3b82f6; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;" onclick="previewItem(${index})">Ver</button>
            <button style="background:#ef4444; color:#fff; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;" onclick="deleteItem(${index})">Eliminar</button>
          </div>
        `;
        container.appendChild(itemDiv);
      });

      if (tvPlaylist.length > 0) previewItem(0);
    }

    function previewItem(index) {
      const item = tvPlaylist[index];
      const screen = document.getElementById('previewScreen');
      screen.innerHTML = "";

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.url;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        screen.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = item.url;
        screen.appendChild(img);
      }
    }

    async function uploadMedia() {
      const fileInput = document.getElementById('mediaFileInput');
      const durationInput = document.getElementById('mediaDuration');
      const file = fileInput.files[0];

      if (!file) return alert("Selecciona un archivo de imagen o video.");

      const isVideo = file.type.includes('video');
      const storageRef = storage.ref(`portanko/${currentTV}/${Date.now()}_${file.name}`);
      
      try {
        const snapshot = await storageRef.put(file);
        const downloadURL = await snapshot.ref.getDownloadURL();

        const newItem = {
          name: file.name,
          url: downloadURL,
          type: isVideo ? 'video' : 'image',
          duration: isVideo ? null : parseInt(durationInput.value)
        };

        tvPlaylist.push(newItem);
        await db.collection('portanko_tvs').doc(currentTV).set({ playlist: tvPlaylist }, { merge: true });

        fileInput.value = "";
        alert("Archivo subido e integrado a " + currentTV);
      } catch (err) {
        console.error(err);
        alert("Error al subir archivo.");
      }
    }

    async function deleteItem(index) {
      if (confirm("¿Deseas eliminar este contenido de la playlist?")) {
        tvPlaylist.splice(index, 1);
        await db.collection('portanko_tvs').doc(currentTV).set({ playlist: tvPlaylist }, { merge: true });
      }
    }

    async function addNewTV() {
      const tvName = prompt("Nombre de la nueva pantalla (ej. tv2, tv-recepcion):");
      if (!tvName) return;

      const tvId = tvName.toLowerCase().replace(/\s+/g, '-');
      
      await db.collection('portanko_tvs').doc(tvId).set({
        name: tvName,
        orientation: 270,
        audioSettings: { enabled: true, audioUrl: "", volume: 0.5 },
        playlist: []
      });

      alert("TV creada con éxito.");
      location.reload();
    }

    function saveTVConfig() {
      const orientation = parseInt(document.getElementById('orientationSelect').value);
      const enabled = document.getElementById('audioEnabled').value === "true";
      const audioUrl = document.getElementById('audioUrl').value;
      const volume = parseFloat(document.getElementById('audioVolume').value);

      db.collection('portanko_tvs').doc(currentTV).set({
        orientation: orientation,
        audioSettings: { enabled, audioUrl, volume }
      }, { merge: true }).then(() => {
        alert("Configuración de " + currentTV + " guardada en Firestore.");
      });
    }

    function logout() {
      sessionStorage.removeItem("portanko_auth");
      window.location.href = "login.html";
    }

    loadTVConfig();
  </script>
</body>
</html>
